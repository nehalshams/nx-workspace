name: Deploy Multiple Nx Apps to AWS S3

on:
  push:
    branches:
      - main   # deploy only when main branch is updated

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [host, machineDashboard, angular]   # 🔹 List of apps in your Nx workspace
        include:
          - app: shell
            bucket: nx-omniblu
          - app: machineDashboard
            bucket: nx-omniblu-m-dashboard
          - app: angular
            bucket: nx-omniblu-angular

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Nx App
        run: npx nx build ${{ matrix.app }} --configuration=production

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1   # change if your S3 bucket is in another region

      - name: Deploy to S3
        run: aws s3 sync dist/apps/${{ matrix.app }} s3://${{ matrix.bucket }} --delete
